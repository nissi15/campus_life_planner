<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Planner</title>
</head>
<body> 
     <a class="skip-link" href="#main-content">Skip to main content</a>
    <div id="polite-message" class="screen-reader-only" role="status"></div>
    <div id="urgent-message" class="screen-reader-only" role="alert"></div>
    
    <header class="heading">
        <a href="#dashboard" class="brand">Edu Planner</a>
        <nav aria-label="Main navigations">
            <ul class="all-navs">
                <li>
                    <a href="#dashboard" class="nav-links active"><img class="nav-icon" src="icons/dashboard.svg" alt="">Dashboard</a>
                </li>
                <li>
                    <a href="#tasks" class="nav-links"><img class="nav-icon" src="icons/tasks.svg" alt="">Tasks</a>
                </li>
                <li>
                    <a href="#about" class="nav-links"><img class="nav-icon" src="icons/about.svg" alt="">About</a>
                </li>
                <li>
                    <a href="#settings" class="nav-links"><img class="nav-icon" src="icons/settings.svg" alt="">Setting</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="top-bar">
        <div class="top-page">
            <span class="dot" aria-hidden="true"></span>
            <span id="top-name">Dashboard</span>
        </div>
        <button class="theme" type="button" data-theme-toggle aria-pressed="false" aria-label="Change to dark mode">
            <img src="icons/dark-theme.svg" alt="" class="theme-icon">
            <span>Dark mode</span>
        </button>
    </div>

    <main id="main-content" tabindex="-1">
        
    </main>
</body>
</html>
